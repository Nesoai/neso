<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NESO · Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#241247;
    --violet:#6D28D9;
    --violet-soft:#A78BFA;
    --lav:#F4F1FB;
    --night:#0F0A1E;
    --night-card-a:#1D1236;
    --night-card-b:#120B24;
    --hairline-l:rgba(36,18,71,.14);
    --hairline-d:rgba(167,139,250,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Instrument Sans',system-ui,sans-serif;
    background:var(--night);
    color:#EDE9FE;
    transition:background .45s ease,color .45s ease;
    display:flex;flex-direction:column;align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
    min-height:100%;
  }
  body.light{background:var(--lav);color:var(--ink)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}

  /* masthead */
  .mast{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px}
  .wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:.14em}
  .mast small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.55;font-weight:500}

  /* selector */
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:5px;border-radius:16px;
    background:rgba(167,139,250,.10);border:1px solid var(--hairline-d);transition:background .45s,border-color .45s}
  body.light .tabs{background:rgba(109,40,217,.07);border-color:var(--hairline-l)}
  .tabs button{
    appearance:none;border:0;background:transparent;border-radius:12px;padding:10px 0;
    font-family:inherit;font-weight:600;font-size:14px;color:inherit;opacity:.6;cursor:pointer;
    transition:background .25s,opacity .25s;
  }
  .tabs button.on{opacity:1;background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(15,10,30,.25)}

  /* card */
  .card{
    border-radius:22px;padding:26px 24px 22px;position:relative;overflow:hidden;
    border:1px solid var(--hairline-d);
    background:linear-gradient(155deg,var(--night-card-a),var(--night-card-b));
    box-shadow:0 18px 44px rgba(10,5,25,.45);
  }
  body.light .card{
    background:linear-gradient(160deg,#FFFFFF,#F3EEFC);
    border-color:var(--hairline-l);
    box-shadow:0 16px 40px rgba(60,30,120,.14);
  }
  .card::after{ /* quiet corner mark */
    content:"NESO";position:absolute;top:22px;right:24px;
    font-family:'Fraunces',serif;font-weight:600;font-size:13px;letter-spacing:.18em;
    color:var(--violet-soft);opacity:.85;
  }
  body.light .card::after{color:var(--violet)}
  .eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
    color:var(--violet-soft);margin-bottom:14px}
  body.light .eyebrow{color:var(--violet)}
  .name{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(24px,7vw,30px);line-height:1.12;
    letter-spacing:.005em;margin-bottom:5px}
  .role{font-size:13.5px;font-weight:500;opacity:.72;margin-bottom:18px}
  .rule{height:1px;background:var(--hairline-d);margin-bottom:16px}
  body.light .rule{background:var(--hairline-l)}
  .row{display:flex;gap:14px;align-items:baseline;padding:5px 0;font-size:14.5px}
  .row .k{width:44px;flex:none;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    font-weight:600;opacity:.5}
  .row a{color:inherit;text-decoration:none;font-weight:500}
  .row a:focus-visible{outline:2px solid var(--violet-soft);outline-offset:3px;border-radius:4px}

  /* QR panel */
  .qrpanel{
    background:#fff;border-radius:22px;padding:22px 20px 18px;text-align:center;
    border:1px solid var(--hairline-d);
    box-shadow:0 14px 36px rgba(10,5,25,.35);
  }
  body.light .qrpanel{border-color:var(--hairline-l);box-shadow:0 12px 32px rgba(60,30,120,.12)}
  #qr{display:flex;justify-content:center}
  #qr img,#qr canvas{border-radius:6px}
  .qrpanel p{margin-top:14px;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:#5B4A85}

  /* save button */
  .save{
    appearance:none;border:0;cursor:pointer;font-family:inherit;
    border-radius:16px;padding:15px 0;font-size:15px;font-weight:600;
    background:var(--violet);color:#fff;letter-spacing:.01em;
    transition:filter .2s;
  }
  .save:active{filter:brightness(1.15)}
  .save:focus-visible{outline:2px solid var(--violet-soft);outline-offset:3px}

  .foot{text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.4;font-weight:500;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <span class="wordmark">NESO</span>
    <small>Digital cards</small>
  </div>

  <div class="tabs" role="tablist" aria-label="Choose a card">
    <button role="tab" data-id="hello">Hello</button>
    <button role="tab" data-id="mallory">Mallory</button>
    <button role="tab" data-id="charles">Charles</button>
  </div>

  <div class="card" id="card">
    <div class="eyebrow" id="c-eyebrow"></div>
    <div class="name" id="c-name"></div>
    <div class="role" id="c-role"></div>
    <div class="rule"></div>
    <div id="c-rows"></div>
  </div>

  <div class="qrpanel">
    <div id="qr" aria-label="Contact QR code"></div>
    <p>Point a phone camera here to save this contact</p>
  </div>

  <button class="save" id="save">Save contact to this phone</button>

  <div class="foot">nesohq.com · advisory &amp; tools for business and real estate</div>
</div>

<script>
const CARDS = {
  hello: {
    theme: 'dark',
    eyebrow: 'The firm',
    name: 'NESO HQ',
    role: 'Advisory and tools for business and real estate',
    rows: [
      ['Text', '(901) 295-0322', 'sms:+19012950322'],
      ['Email', 'hello@nesohq.com', 'mailto:hello@nesohq.com'],
      ['Web', 'nesohq.com', 'https://nesohq.com']
    ],
    vcf: [
      'BEGIN:VCARD','VERSION:3.0',
      'FN:NESO HQ',
      'ORG:NESO HQ LLC',
      'TEL;TYPE=WORK,VOICE:+19012950322',
      'EMAIL;TYPE=WORK:hello@nesohq.com',
      'URL:https://nesohq.com',
      'NOTE:Advisory and tools for business and real estate. Text line — (901) 295-0322.',
      'END:VCARD'
    ]
  },
  mallory: {
    theme: 'light',
    eyebrow: 'Business & growth',
    name: 'Mallory K. Bailey, MBA',
    role: 'Managing Member · NESO HQ LLC',
    rows: [
      ['Text', '(901) 295-0322', 'sms:+19012950322'],
      ['Email', 'hello@nesohq.com', 'mailto:hello@nesohq.com'],
      ['Web', 'nesohq.com', 'https://nesohq.com']
    ],
    vcf: [
      'BEGIN:VCARD','VERSION:3.0',
      'N:Bailey;Mallory;K.;;',
      'FN:Mallory K. Bailey\\, MBA',
      'ORG:NESO HQ LLC',
      'TITLE:Managing Member',
      'TEL;TYPE=WORK,VOICE:+19012950322',
      'EMAIL;TYPE=WORK:hello@nesohq.com',
      'URL:https://nesohq.com',
      'NOTE:Advisory and tools for business and real estate.',
      'END:VCARD'
    ]
  },
  charles: {
    theme: 'dark',
    eyebrow: 'Real estate & land',
    name: 'Charles L. Finkley, Jr., MPA',
    role: 'Reviewing Principal · Real Estate & Land',
    rows: [
      ['Cell', '(901) 428-6801', 'tel:+19014286801'],
      ['Text', '(901) 295-0322', 'sms:+19012950322'],
      ['Email', 'hello@nesohq.com', 'mailto:hello@nesohq.com'],
      ['Web', 'nesohq.com', 'https://nesohq.com']
    ],
    vcf: [
      'BEGIN:VCARD','VERSION:3.0',
      'N:Finkley;Charles;L.;;Jr.',
      'FN:Charles L. Finkley\\, Jr.\\, MPA',
      'ORG:NESO HQ LLC',
      'TITLE:Reviewing Principal — Real Estate & Land',
      'TEL;TYPE=CELL,VOICE:+19014286801',
      'TEL;TYPE=WORK,VOICE:+19012950322',
      'EMAIL;TYPE=WORK:hello@nesohq.com',
      'URL:https://nesohq.com',
      'NOTE:Seventeen years in land use\\, entitlements and economic development.',
      'END:VCARD'
    ]
  }
};

const tabs = [...document.querySelectorAll('.tabs button')];
const qrBox = document.getElementById('qr');
let current = 'hello';

function vcfText(c){ return c.vcf.join('\r\n'); }

function render(id){
  current = id;
  const c = CARDS[id];
  document.body.classList.toggle('light', c.theme === 'light');
  tabs.forEach(b => b.classList.toggle('on', b.dataset.id === id));
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  document.getElementById('c-eyebrow').textContent = c.eyebrow;
  document.getElementById('c-name').textContent = c.name;
  document.getElementById('c-role').textContent = c.role;
  document.getElementById('c-rows').innerHTML = c.rows.map(r =>
    `<div class="row"><span class="k">${r[0]}</span><a href="${r[2]}">${r[1]}</a></div>`
  ).join('');
  qrBox.innerHTML = '';
  new QRCode(qrBox, {
    text: vcfText(c),
    width: 216, height: 216,
    colorDark: '#1D1236', colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.M
  });
}

tabs.forEach(b => b.addEventListener('click', () => render(b.dataset.id)));

document.getElementById('save').addEventListener('click', () => {
  const c = CARDS[current];
  const blob = new Blob([vcfText(c)], {type:'text/vcard'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'NESO-' + current + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

// Deep-link a card: /cards.html#charles opens Charles directly
const hash = location.hash.replace('#','');
render(CARDS[hash] ? hash : 'hello');
</script>
</body>
</html>
