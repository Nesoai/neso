<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>NESO Request for Quote</title>

<style>
/* Layout: a purple NESO band on top, one centered working column below; the desk lists jobs, the contractor sees one job sheet with the quote form under it. */
:root{
  --band:#3D1A5C; --accent:#5B2A86; --accent-btn:#5B2A86; --on-accent:#FFFFFF;
  --gold:#E7B84B; --gold-soft:#FDF7E7; --gold-ink:#7A5A12;

  --bg:#FFFFFF; --panel:#F7F3FB; --field:#FFFFFF;
  --good:#2F6B4F; --good-soft:#E8F2EC; --bad:#9B2C2C; --bad-soft:#F7E6E6;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#2A1240; --accent:#C9A2EC; --accent-btn:#8450B5; --on-accent:#FFFFFF;
  --gold:#E7B84B; --gold-soft:#33290F; --gold-ink:#F0CF7E;
  --ink:#F3EEF8; --text:#D8D1E1; --muted:#A49CB0; --line:#382F42;
  --bg:#131017; --panel:#1D1823; --field:#1A1520;
  --good:#86CDA7; --good-soft:#16271E; --bad:#EE9A9A; --bad-soft:#2E1616; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#2A1240; --accent:#C9A2EC; --accent-btn:#8450B5; --on-accent:#FFFFFF;
  --gold:#E7B84B; --gold-soft:#33290F; --gold-ink:#F0CF7E;
  --ink:#F3EEF8; --text:#D8D1E1; --muted:#A49CB0; --line:#382F42;
  --bg:#131017; --panel:#1D1823; --field:#1A1520;
  --good:#86CDA7; --good-soft:#16271E; --bad:#EE9A9A; --bad-soft:#2E1616; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,4vw,32px);line-height:1.2}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.3}
h3{font-size:15px;font-weight:600}
.band{background:var(--band);color:#fff}
.band-in{max-width:980px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:flex;flex-direction:column;gap:4px}
.mark b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
.mark i{display:flex;gap:0;height:3px}
.mark i::before{content:"";width:44px;background:#B48AD9}
.mark i::after{content:"";width:24px;background:var(--gold)}
.band small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:#fff;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;opacity:.85}
.nav button[aria-current="true"]{border-color:rgba(255,255,255,.45);opacity:1}
.nav button:hover{opacity:1}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.wrap.narrow{max-width:780px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-size:14px;font-weight:500;border-radius:var(--r);padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}

.btn.big{font-size:16px;padding:12px 22px;min-height:48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border-radius:var(--r);padding:18px}
.sheet{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);color:var(--text);padding:12px 14px;border-radius:0 var(--r) var(--r) 0}
.note b{color:var(--ink)}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.s-draft::before{background:var(--muted)}
.pill.s-out::before,.pill.s-new::before{background:var(--gold)}
.pill.s-quotes::before,.pill.s-shortlist::before{background:var(--accent)}
.pill.s-owner::before{background:#4F7FD9}
.pill.s-awarded::before,.pill.s-selected::before{background:var(--good)}
.pill.s-closed::before,.pill.s-passed::before{background:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fact .v{color:var(--ink);overflow-wrap:anywhere}
.fact .v a{font-weight:500}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.items{width:100%;border-collapse:collapse;font-size:14px}
.items th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.items td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.items td.num,.items th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--accent)}
/* forms */
form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink);padding:0;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink);min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%;min-height:42px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.req::after{content:" *";color:var(--bad)}
.cb{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text);cursor:pointer}
.cb input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent-btn);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--text)}
.chip input:checked+span{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.itemrow{display:grid;grid-template-columns:1fr 170px 40px;gap:8px;align-items:start}
.pricerow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pricerow .d{min-width:0;overflow-wrap:anywhere}
.money{position:relative}
.money::before{content:"$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money input{padding-left:24px;text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:var(--r);background:var(--panel)}
.total .money{width:200px;max-width:100%}
.total .money input{font-size:20px;font-weight:600}
.err{color:var(--bad);font-size:13px}
.sticky-submit{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
/* jobs list */
.jobs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;width:100%}
.job:hover{background:var(--panel)}
.job .t{font-weight:600;color:var(--ink);font-size:16px}
.job .meta{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.job .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px}
.ref{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);letter-spacing:.04em}
.due-late{color:var(--bad);font-weight:500}
.due-soon{color:var(--gold-ink);font-weight:500}
/* compare */
.cmp{border-collapse:collapse;font-size:14px;min-width:100%}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:170px}
.cmp th:first-child,.cmp td:first-child{min-width:130px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:sticky;left:0;background:var(--bg)}
.cmp .big{font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cmp .low{color:var(--good);font-size:12px;font-weight:600}
.cmp input,.cmp select{min-height:36px;padding:6px 8px;font-size:14px}
.sendlist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.sendrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.sendrow .who{min-width:0}
.sendrow .who b{color:var(--ink)}
.linkbox{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.copyarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;min-height:160px}
.empty{padding:28px;text-align:left;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px}
.owner-prev{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg)}
.opt{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.opt h3{font-family:var(--f-display);font-size:18px}
.opt .price{font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
footer.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:560px){
  .itemrow{grid-template-columns:1fr 40px}
  .itemrow .qty{grid-column:1/2}
  .pricerow{grid-template-columns:1fr 120px}
  .job{grid-template-columns:1fr}
  .job .right{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .sendrow{grid-template-columns:1fr}
}
@media print{
  .band,.nav,.noprint,.sticky-submit{display:none!important}
  body{background:#fff;color:#000}
  .sheet{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="band"><div class="band-in">
  <div class="mark"><b>NESO</b><i></i></div>
  <small id="bandLabel">Request for quote</small>
  <nav class="nav" id="nav" hidden>
    <button type="button" data-act="nav" data-v="jobs">Jobs</button>
    <button type="button" data-act="nav" data-v="contractors">Contractors</button>
    <button type="button" data-act="nav" data-v="settings">Settings</button>
  </nav>
</div></header>
<main id="app" class="wrap"><p class="muted">Loading…</p></main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ---------- defaults ---------- */
const DEFAULTS={formUrl:"https://nesohq.com/quote.html",company:"NESO HQ LLC",nesoName:"Mallory Bailey",nesoPhone:"(901) 295-0322",nesoEmail:"mallory@nesohq.com",website:"nesohq.com"};
const WORK_TYPES=["Renovation","Landscape","Hardscape","Painting","Flooring","Roofing","Plumbing","Electrical","HVAC","Cleanup / hauling","Other"];
const JOB_STATUS=[["draft","Draft"],["out","Out for quotes"],["quotes","Quotes in"],["owner","Sent to owner"],["awarded","Awarded"],["closed","Closed"]];
const Q_STATUS=[["new","New"],["shortlist","Shortlist"],["selected","Selected"],["passed","Passed"]];
const PERMITS=["Contractor pulls any permits","Owner pulls permits","No permits expected","Not sure — contractor to advise"];
const MATERIALS=["Contractor supplies all materials","Owner supplies some materials (see notes)","Contractor to advise"];
const PRICE_TYPES=["Fixed price","Estimate","Not-to-exceed","Time and materials"];

/* ---------- small helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=(n=10)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const b=crypto.getRandomValues(new Uint8Array(n));b.forEach(x=>s+=a[x%a.length]);return s};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:null};
const money=v=>{const n=num(v);return n==null?"—":"$"+n.toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fDate=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");if(isNaN(d))return iso;return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})};
const fTime=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);if(isNaN(h))return t;const ap=h>=12?"PM":"AM";return((h%12)||12)+":"+String(m||0).padStart(2,"0")+" "+ap};
const daysUntil=iso=>{if(!iso)return null;const a=new Date(todayISO()+"T12:00:00"),b=new Date(iso+"T12:00:00");return Math.round((b-a)/864e5)};
const telHref=p=>"tel:"+String(p||"").replace(/[^0-9+]/g,"");
const mapsHref=j=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([j.address,j.city,j.state,j.zip].filter(Boolean).join(", "));
const fullAddr=j=>[j.address,[j.city,j.state].filter(Boolean).join(", ")+(j.zip?" "+j.zip:"")].filter(s=>s&&s.trim()).join(", ");
const visitLine=j=>{let s=fDate(j.visitDate);if(j.visitStart)s+=", "+fTime(j.visitStart)+(j.visitEnd?" – "+fTime(j.visitEnd):"");return s};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
async function copyText(text,fallbackEl){
  try{await navigator.clipboard.writeText(text);toast("Copied");return true}
  catch(e){if(fallbackEl){fallbackEl.hidden=false;fallbackEl.value=text;fallbackEl.focus();fallbackEl.select()}toast("Select the text and copy it");return false}
}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- compact codes for links and returned quotes ---------- */
const b64u={enc(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  dec(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const bin=atob(str);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}};
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=="undefined"){try{const s=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));return"z"+b64u.enc(new Uint8Array(await new Response(s).arrayBuffer()))}catch(e){}}
  return"j"+b64u.enc(raw);
}
async function unpack(code){
  code=String(code).replace(/[\s>]/g,"");
  const kind=code[0];let bytes=b64u.dec(code.slice(1));
  if(kind==="z"){const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(s).arrayBuffer())}
  else if(kind!=="j")throw new Error("Unknown code");
  return JSON.parse(new TextDecoder().decode(bytes));
}
const PUBLIC_JOB_FIELDS=["id","ref","title","workTypes","propType","occupied","address","city","state","zip","scope","items","visitDate","visitStart","visitEnd","visitAlt","siteName","siteRole","sitePhone","siteEmail","access","callAhead","dueDate","targetStart","targetFinish","permits","materials","reqLicense","reqInsurance","reqCleanup","reqPhotos","reqLineItems","routeThroughNeso","links","notes"];
function publicJob(job,settings,contractor){
  const p={v:1};PUBLIC_JOB_FIELDS.forEach(k=>{if(job[k]!==undefined&&job[k]!==""&&!(Array.isArray(job[k])&&!job[k].length))p[k]=job[k]});
  p.neso={company:settings.company,name:settings.nesoName,phone:settings.nesoPhone,email:settings.nesoEmail,website:settings.website};
  if(contractor)p.to={cid:contractor.id,name:contractor.name||"",company:contractor.company||"",email:contractor.email||"",phone:contractor.phone||""};
  return p;
}
async function contractorLink(job,settings,contractor){return(settings.formUrl||DEFAULTS.formUrl)+"#r="+await pack(publicJob(job,settings,contractor))}

/* ---------- shared renderers: job sheet + quote form (used by desk and contractor page) ---------- */
function jobSheetHTML(j,opts={}){
  const neso=j.neso||{};
  const items=(j.items||[]).filter(i=>i&&i.d);
  const reqs=[];
  if(j.permits)reqs.push("Permits: "+j.permits);
  if(j.materials)reqs.push("Materials: "+j.materials);
  if(j.reqLicense)reqs.push("Include your contractor license number");
  if(j.reqInsurance)reqs.push("Certificate of insurance (general liability; workers' comp if you have employees) before work starts");
  if(j.reqCleanup)reqs.push("Daily cleanup and haul-away of debris included in price");
  if(j.reqPhotos)reqs.push("Before and after photos of the work");
  if(j.reqLineItems&&items.length)reqs.push("Price each line item separately");
  const links=String(j.links||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const due=j.dueDate?daysUntil(j.dueDate):null;
  return `
  <section class="sheet" aria-label="Job details">
    <div class="stack" style="gap:6px">

function wireQuoteForm(root){
  const total=$("#q_total",root);if(!total)return;
  const ips=$$("[data-ip]",root),other=$("#q_other",root),hint=$("#sumHint",root);
  total.addEventListener("input",()=>{total.dataset.touched=total.value?"1":""});
  const recalc=()=>{let s=0,any=false;[...ips,other].forEach(i=>{if(!i)return;const n=num(i.value);if(n!=null){s+=n;any=true}});
    if(!hint)return;if(!any){hint.textContent="";return}
    hint.textContent="Line items add up to "+money(s);
    if(total.dataset.touched!=="1")total.value=String(Math.round(s*100)/100)};
  [...ips,other].forEach(i=>i&&i.addEventListener("input",recalc));recalc();
}
function readQuoteForm(root,j){
  const f=$("#qform",root);const q={};
  $$("input[name],select[name],textarea[name]",f).forEach(el=>{q[el.name]=el.type==="checkbox"?el.checked:el.value.trim()});
  q.itemPrices=$$("[data-ip]",f).map(i=>i.value.trim());
  q.itemLabels=(j.items||[]).filter(i=>i&&i.d).map(i=>i.d);
  return q;
}
function validateQuote(q,j,mode){
  const miss=[];
  if(!q.company)miss.push("company name");
  if(mode!=="desk"){if(!q.contact)miss.push("your name");if(!q.phone&&!q.email)miss.push("a phone or email");}
  if(num(q.total)==null)miss.push("total price");
  if(!q.duration)miss.push("how long the job takes");
  if(mode!=="desk"){if(j.reqLicense&&!q.license)miss.push("license number");if(!q.ackShare||!q.ackNoStart)miss.push("both confirmation boxes");if(!q.signName)miss.push("your typed name");}
  return miss;
}
const startText=q=>[q.earliestStart?fDate(q.earliestStart):"",q.startWithin||""].filter(Boolean).join(" · ")||"—";
const durText=q=>q.duration?q.duration+" "+(q.durationUnit||"days"):"—";

function quoteAsText(j,q){
  const L=[];const add=(k,v)=>{if(v)L.push(k+": "+v)};
  L.push("QUOTE FOR NESO — "+(j.ref||"")+" "+(j.title||""));
  L.push(fullAddr(j));L.push("");
  add("Company",q.company);add("Contact",q.contact);add("Phone",q.phone);add("Email",q.email);add("License",q.license);add("Insurance",q.insured);add("Site visited",q.visited?fDate(q.visited):"");
  L.push("");add("TOTAL",money(q.total)+" ("+(q.priceType||"Fixed price")+")");
  (q.itemLabels||[]).forEach((d,i)=>{if(q.itemPrices&&q.itemPrices[i])L.push("  "+(i+1)+". "+d+" — "+money(q.itemPrices[i]))});
  if(q.other)L.push("  Other — "+money(q.other));
  add("Deposit / terms",q.deposit);add("Price good until",q.validUntil?fDate(q.validUntil):"");
  L.push("");add("Earliest start",startText(q));add("Job length",durText(q));add("Crew",q.crew);
  const block=(k,v)=>{if(v){L.push("");L.push(k+":");L.push(v)}};
  block("Included",q.included);block("Not included",q.excluded);block("Found on site",q.findings);block("Options",q.alternates);
  add("Warranty",q.warranty);add("Photos / written quote",q.photos);block("Questions",q.questions);
  if(q.signName){L.push("");L.push("Signed: "+q.signName+" on "+fDate(todayISO()))}
  return L.join("\n");
}

async function contractorPage(code){
  $("#bandLabel").textContent="Request for quote";
  let j;try{j=await unpack(code)}catch(e){app.className="wrap narrow";app.innerHTML=`<div class="note bad"><b>This link didn't open.</b> It may have been cut off when it was copied. Ask NESO to send it again, or reply to their email with your price.</div>`;return}
  const neso=j.neso||DEFAULTS;const key="neso-quote-"+(j.id||j.ref);
  let draft=store.get(key)||{};
  const inArtifact=typeof window.claude!=="undefined";
  app.className="wrap narrow";
  const render=()=>{
    app.innerHTML=jobSheetHTML(j,{extra:inArtifact?"":`<button type="button" class="btn ghost noprint" data-act="print">Print job sheet</button>`})+
    `<section class="stack noprint" style="gap:16px"><div class="stack" style="gap:4px"><span class="eyebrow">After your site visit</span><h2>Send NESO your quote</h2><p class="muted" style="margin:0">Fill this in from your phone or computer. Your answers save on this device as you type, so you can come back to finish.</p></div>`+
    quoteFormHTML(j,draft,"contractor")+
    `<div class="sticky-submit"><button type="button" class="btn primary big" data-act="cq-submit">Review and send quote</button><span class="muted small">Questions? Call ${esc(neso.name||"NESO")} at <a href="${esc(telHref(neso.phone))}">${esc(neso.phone||"")}</a></span></div></section>
    <footer class="foot">${esc(neso.company||"NESO HQ LLC")} · ${esc(neso.website||"nesohq.com")}. This request is not a contract or a promise of work.</footer>`;
    wireQuoteForm(app);
    $("#qform").addEventListener("input",()=>{draft=readQuoteForm(app,j);store.set(key,draft)});
  };
  render();
  if(contractorPage._wired)return;contractorPage._wired=true;
  app.addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="print"){window.print();return}
    if(b.dataset.act==="cq-submit"){
      const q=readQuoteForm(app,j);const miss=validateQuote(q,j,"contractor");const er=$("#qerr");
      if(miss.length){er.hidden=false;er.textContent="Please add: "+miss.join(", ")+".";er.scrollIntoView({block:"center",behavior:"smooth"});return}
      store.set(key,q);draft=q;await showSend(q);

    if(b.dataset.act==="cq-edit"){render();window.scrollTo(0,0)}
    if(b.dataset.act==="cq-copy"){copyText(b._text,$("#cqText"))}
  });
  async function showSend(q){

    const code=await pack(payload);
    const tail="\n\n— Do not edit below this line. NESO's quote desk reads it. —\nNESO-QUOTE:"+code+":END";
    const subject="Quote: "+(j.ref?j.ref+" — ":"")+(j.title||"")+" — "+q.company;
    let body=quoteAsText(j,q)+tail;
    const to=neso.email||DEFAULTS.nesoEmail;
    let href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    let shortened=false;
    if(href.length>1900){shortened=true;const shortBody="Quote for "+(j.ref||"")+" "+(j.title||"")+"\nCompany: "+q.company+"\nTotal: "+money(q.total)+"\nEarliest start: "+startText(q)+"\nJob length: "+durText(q)+"\n\nFull details are in the code below."+tail;
      href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(shortBody)}
    app.innerHTML=`<section class="sheet">
      <span class="eyebrow">Almost done</span>
      <h1>Send your quote to NESO</h1>
      <p style="margin:0">Tap the button to open an email to NESO with everything filled in, then press <b>Send</b> in your email app.</p>
      <div class="row"><a class="btn primary big" href="${esc(href)}">Open email to NESO</a><button type="button" class="btn" data-act="cq-copy">Copy quote</button><button type="button" class="btn ghost" data-act="cq-edit">Make changes</button></div>
      <div class="note"><b>If no email opens,</b> copy the quote and email it to <b style="user-select:all">${esc(to)}</b>, or text ${esc(neso.name||"NESO")} at <span style="user-select:all">${esc(neso.phone||"")}</span>.${shortened?" Your email will show a short summary plus a code that carries every detail.":""}</div>
      <textarea id="cqText" class="copyarea" readonly hidden aria-label="Quote text"></textarea>
      <div class="facts">
        <div class="fact"><span class="k">Total</span><span class="v" style="font-size:20px;font-weight:600">${esc(money(q.total))}</span></div>
        <div class="fact"><span class="k">Earliest start</span><span class="v">${esc(startText(q))}</span></div>
        <div class="fact"><span class="k">Job length</span><span class="v">${esc(durText(q))}</span></div>
        <div class="fact"><span class="k">Price good until</span><span class="v">${esc(fDate(q.validUntil)||"—")}</span></div>
      </div>
      <p class="muted small" style="margin:0">NESO will review your quote with the owner and get back to you. Please don't start work or buy materials until NESO confirms in writing.</p>
    </section>`;
    $("[data-act=cq-copy]")._text=body;
    window.scrollTo(0,0);
  }
}

const S={db:null,mcp:null,jobs:{},quotes:{},contractors:{},settings:Object.assign({},DEFAULTS),view:"jobs",id:null,loaded:false,ownerOpts:{}};
const sortedJobs=()=>Object.values(S.jobs).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
const jobQuotes=id=>Object.values(S.quotes).filter(q=>q.job===id).sort((a,b)=>(num(a.total)||0)-(num(b.total)||0));
const statusPill=(list,v)=>{const s=list.find(x=>x[0]===v)||list[0];return`<span class="pill s-${s[0]}">${esc(s[1])}</span>`};
function go(view,id){S.view=view;S.id=id||null;renderDesk();window.scrollTo(0,0)}
function nextRef(){const d=todayISO().replace(/-/g,"").slice(2);const n=Object.values(S.jobs).filter(j=>(j.ref||"").includes(d)).length+1;return"RFQ-"+d+"-"+String(n).padStart(2,"0")}
async function save(col,id,data){
  if(!S.db){toast("Can't save: sign in to claude.ai to use the desk");throw new Error("no db")}
  try{await S.db.collection(col).doc(id).set(data)}catch(e){toast("Save didn't go through: "+(e&&e.message||"try again"));throw e}
}
async function remove(col,id){try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Couldn't delete: "+(e&&e.message||""));throw e}}

async function desk(){
  $("#nav").hidden=false;app.className="wrap";
  app.innerHTML=`<div class="empty"><h2>Opening the quote desk…</h2><p class="muted" style="margin:0">Loading your jobs, contractors and quotes.</p></div>`;
  let db=null;try{db=await window.claude.use("db")}catch(e){}
  if(!db){app.innerHTML=`<div class="note"><b>Sign in to use the quote desk.</b> Jobs and quotes are saved to NESO's private desk, which needs a signed-in claude.ai account with access to this page. Contractors use the separate quote link and never need an account.</div>`;return}
  S.db=db;
  window.claude.use("mcp").then(m=>{S.mcp=m}).catch(()=>{});
  let got=0;const done=()=>{if(++got>=3){S.loaded=true;clearTimeout(timer);renderDesk()}};
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;renderDesk();toast("Still connecting — showing what's loaded")}},10000);
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data())});S[key]=m;if(!S.loaded)done();else renderDeskSoft()},err=>{toast("Lost connection to the desk: "+(err&&err.message||""));if(!S.loaded)done()});
  sub("jobs","jobs");sub("quotes","quotes");sub("contractors","contractors");
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},DEFAULTS,s.data());if(S.loaded)renderDeskSoft()},()=>{});
}
function renderDeskSoft(){const a=document.activeElement;if(a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(S.view==="edit"||S.view==="addquote")return;renderDesk()}

function renderDesk(){
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===S.view||(S.view!=="contractors"&&S.view!=="settings"&&b.dataset.v==="jobs"))));
  const v=S.view;
  if(v==="jobs")return viewJobs();
  if(v==="edit")return viewEdit();
  if(v==="job")return viewJob();
  if(v==="preview")return viewPreview();
  if(v==="addquote")return viewAddQuote();
  if(v==="contractors")return viewContractors();
  if(v==="settings")return viewSettings();
}

function viewJobs(){

function readJobForm(){
  const f=$("#jform");const j=Object.assign({},S._editing);
  $$("input[name],select[name],textarea[name]",f).forEach(el=>{if(el.name==="workTypes")return;j[el.name]=el.type==="checkbox"?el.checked:el.value.trim()});
  j.workTypes=$$("input[name=workTypes]:checked",f).map(i=>i.value);
  j.items=$$("[data-item]",f).map(r=>({d:$("[data-k=d]",r).value.trim(),q:$("[data-k=q]",r).value.trim()})).filter(i=>i.d);
  j.state=(j.state||"").toUpperCase();
  return j;
}

function compareHTML(j,qs){

  const items=(j.items||[]).filter(i=>i&&i.d);
  const row=(label,f)=>`<tr><td>${label}</td>${qs.map(q=>`<td>${f(q)}</td>`).join("")}</tr>`;
  return`<div class="scroll"><table class="cmp"><thead><tr><th></th>${qs.map(q=>`<th><b style="color:var(--ink)">${esc(q.company||"—")}</b><div class="muted small" style="font-weight:400">${esc(q.contact||"")}${q.phone?" · "+esc(q.phone):""}</div></th>`).join("")}</tr></thead><tbody>
  ${row("Total",q=>`<div class="big">${esc(money(q.total))}</div>${num(q.total)===low&&qs.length>1?`<div class="low">Lowest</div>`:""}<div class="muted small">${esc(q.priceType||"")}</div>`)}
  ${items.map((it,i)=>row(esc((i+1)+". "+it.d.slice(0,40)),q=>esc(q.itemPrices&&q.itemPrices[i]?money(q.itemPrices[i]):"—"))).join("")}
  ${row("Earliest start",q=>esc(startText(q)))}
  ${row("Job length",q=>esc(durText(q))+(q.crew?`<div class="muted small">Crew of ${esc(q.crew)}</div>`:""))}
  ${row("Price good until",q=>{const d=daysUntil(q.validUntil);return esc(fDate(q.validUntil)||"—")+(d!=null&&d<0?` <span class="due-late">expired</span>`:"")})}
  ${row("Deposit / terms",q=>esc(q.deposit||"—"))}
  ${row("Insurance",q=>esc(q.insured||"—")+(q.license?`<div class="muted small">Lic. ${esc(q.license)}</div>`:""))}
  ${row("Visited site",q=>esc(q.visited?fDate(q.visited):"—"))}
  ${row("Warranty",q=>esc(q.warranty||"—"))}
  ${row("Included",q=>`<div class="prose small">${esc(q.included||"—")}</div>`)}
  ${row("Not included",q=>`<div class="prose small">${esc(q.excluded||"—")}</div>`)}
  ${row("Found on site",q=>`<div class="prose small">${esc(q.findings||"—")}</div>`)}

  ${row("Photos",q=>q.photos&&/^https?:/i.test(q.photos)?`<a href="${esc(q.photos)}" target="_blank" rel="noopener">Open</a>`:esc(q.photos||"—"))}
  ${row("NESO status",q=>`<select data-act-change="q-status" data-qid="${esc(q.id)}">${Q_STATUS.map(s=>`<option value="${s[0]}"${(q.status||"new")===s[0]?" selected":""}>${s[1]}</option>`).join("")}</select>`)}
  ${row("Price to owner",q=>`<div class="money"><input type="text" inputmode="decimal" data-act-change="q-owner" data-qid="${esc(q.id)}" value="${esc(q.ownerPrice||"")}" placeholder="${esc(String(ownerPriceOf(j,q)||""))}" aria-label="Price to owner for ${esc(q.company)}"></div><div class="muted small">Blank uses the markup below</div>`)}
  ${row("",q=>`<div class="row" style="gap:4px"><button class="btn ghost" type="button" data-act="edit-quote" data-qid="${esc(q.id)}">Edit</button><button class="btn ghost danger" type="button" data-act="del-quote" data-qid="${esc(q.id)}">Remove</button></div><div class="muted small">${q.receivedAt?"Received "+esc(fDate(q.receivedAt.slice(0,10))):""}${q.source==="manual"?" · entered by hand":""}</div>`)}
  </tbody></table></div>`;
}
function ownerPriceOf(j,q){const o=num(q.ownerPrice);if(o!=null)return o;const t=num(q.total);if(t==null)return null;const m=num(j.markupPct)||0;return Math.round(t*(1+m/100))}

async function gmailDraft(mail){
  if(!S.mcp){toast("Gmail isn't available on this page right now. Use Copy email instead.");return false}
  try{const r=await S.mcp.callTool("Gmail","create_draft",{to:[mail.to],subject:mail.subject,body:mail.text,htmlBody:mail.html});
    let url="";try{const p=r.payload||r.structuredContent||JSON.parse((r.content||[]).map(c=>c.text||"").join(""));url=(p&&(p.viewUrl||(p.draft&&p.draft.viewUrl)))||""}catch(e){}
    toast("Draft saved in Gmail. Review it there and press Send.");
    if(url){const slot=$("#draftSlot");if(slot)slot.innerHTML=`<div class="note good"><b>Draft saved in Gmail.</b> <a href="${esc(url)}" target="_blank" rel="noopener">Open it to review and send</a>.</div>`}
    return true}
  catch(e){const code=e&&e.code;toast(code==="server_not_connected"||code==="server_not_found"?"Connect Gmail in claude.ai to make drafts. Copy email works now.":code==="not_granted"||code==="consent_required"?"Gmail access wasn't allowed for this page. Copy email works now.":"Gmail draft didn't save: "+(e&&e.message||"try Copy email"));return false}
}

/* --- desk events --- */
async function onDeskClick(e){
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  try{
  if(a==="nav"){S._editQuote=null;S._pasted=null;S._editCon=null;return go(b.dataset.v)}
  if(a==="new"){S._editing=null;return go("edit",null)}
  if(a==="open")return go("job",b.dataset.id);
  if(a==="edit")return go("edit",b.dataset.id);
  if(a==="preview")return go("preview",b.dataset.id);
  if(a==="addquote"){S._editQuote=null;S._pasted=null;return go("addquote",b.dataset.id||S.id)}
  if(a==="add-item"){const box=$("#items");box.insertAdjacentHTML("beforeend",itemRowHTML({},box.children.length));$("[data-item]:last-child input",box).focus();return}
  if(a==="rm-item"){b.closest("[data-item]").remove();return}
  if(a==="save-job"){const j=readJobForm();const miss=[];if(!j.title)miss.push("job name");if(!j.scope&&!j.items.length)miss.push("scope of work");if(!j.address)miss.push("street address");if(!j.dueDate)miss.push("quote due date");
    if(miss.length){const er=$("#jerr");er.hidden=false;er.textContent="Please add: "+miss.join(", ")+".";return}
    j.createdAt=j.createdAt||new Date().toISOString();j.updatedAt=new Date().toISOString();b.disabled=true;
    await save("jobs",j.id,j);S.jobs[j.id]=j;toast("Saved");return go("job",j.id)}
  const j=S.jobs[S.id];
  if(a==="copy-link"){const c=S.contractors[b.dataset.cid];return copyText(await contractorLink(j,S.settings,c),$("#copyFallback"))}
  if(a==="copy-rfq"){const c=S.contractors[b.dataset.cid];const m=await rfqEmail(j,c);await copyText("Subject: "+m.subject+"\n\n"+m.text,$("#copyFallback"));return}
  if(a==="gmail-rfq"){const c=S.contractors[b.dataset.cid];b.disabled=true;const m=await rfqEmail(j,c);const ok=await gmailDraft(m);b.disabled=false;if(ok)await markSent(j,c.id,"Gmail draft");return}
  if(a==="mark-sent"){await markSent(j,b.dataset.cid,"");toast("Marked as sent");return}
  if(a==="del-job"){const box=$("#delConfirm");box.innerHTML=` <span class="small">Delete this request and its quotes? </span><button class="btn danger" type="button" data-act="del-job-yes">Delete</button>`;return}
  if(a==="del-job-yes"){const id=S.id;for(const q of jobQuotes(id))await remove("quotes",q.id);await remove("jobs",id);delete S.jobs[id];toast("Deleted");return go("jobs")}
  if(a==="edit-quote"){S._editQuote=Object.assign({},S.quotes[b.dataset.qid]);return go("addquote",S._editQuote.job)}
  if(a==="del-quote"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to remove";return}await remove("quotes",b.dataset.qid);toast("Removed");return}
  if(a==="copy-owner"){const list=ownerQuotes(j,jobQuotes(j.id));return copyText(ownerSummaryText(j,list),$("#copyFallback")||null)}
  if(a==="gmail-owner"){b.disabled=true;const ok=await gmailDraft(ownerEmail(j));b.disabled=false;if(ok&&(j.status||"")!=="awarded")await save("jobs",j.id,Object.assign({},j,{status:"owner",updatedAt:new Date().toISOString()}));return}
  if(a==="read-quote"){const txt=$("#pasteQuote").value;const m=txt.match(/NESO-QUOTE:([\s\S]*?):END/);const msg=$("#pasteMsg");
    if(!m){msg.innerHTML=`<span class="err">No quote code found. Make sure the paste includes the line starting with NESO-QUOTE: through :END.</span>`;return}
    try{const p=await unpack(m[1]);if(!S.jobs[p.job]){msg.innerHTML=`<span class="err">This quote is for ${esc(p.ref||"a job")} which isn't on the desk. It may have been deleted.</span>`;return}
      S._pasted=p;S.id=p.job;viewAddQuote();}catch(err){msg.innerHTML=`<span class="err">The code is incomplete. Copy the whole email again, including the last line.</span>`}return}
  if(a==="save-quote"){const jid=S._editQuote?S._editQuote.job:$("#qjob").value;const jj=S.jobs[jid];if(!jj)return toast("Pick the job first");
    const q=readQuoteForm(app,jj);const miss=validateQuote(q,jj,"desk");if(miss.length){const er=$("#qerr");er.hidden=false;er.textContent="Please add: "+miss.join(", ")+".";return}
    const base=S._editQuote||{id:rid(),job:jid,status:"new",receivedAt:new Date().toISOString(),source:S._pasted?"form":"manual",cid:S._pasted?S._pasted.cid:""};
    if(S._pasted){["contact","phone","email","signName","ackShare","ackNoStart","submittedAt"].forEach(k=>{if(S._pasted.q[k]!=null&&q[k]==null)q[k]=S._pasted.q[k]})}
    const rec=Object.assign({},base,q,{job:jid,ref:jj.ref});b.disabled=true;await save("quotes",rec.id,rec);
    if(["draft","out"].includes(jj.status||"draft"))await save("jobs",jj.id,Object.assign({},jj,{status:"quotes",updatedAt:new Date().toISOString()}));
    S._editQuote=null;S._pasted=null;toast("Quote saved");return go("job",jid)}
  if(a==="save-con"){const c=Object.assign({},S._editCon||{id:rid()},{company:$("#c_company").value.trim(),name:$("#c_name").value.trim(),email:$("#c_email").value.trim(),phone:$("#c_phone").value.trim(),notes:$("#c_notes").value.trim(),trades:$$("input[name=c_trades]:checked").map(i=>i.value)});
    if(!c.company&&!c.name)return toast("Add a company or contact name");await save("contractors",c.id,c);S.contractors[c.id]=c;S._editCon=null;toast("Saved");return viewContractors()}
  if(a==="edit-con"){S._editCon=Object.assign({},S.contractors[b.dataset.cid]);return viewContractors()}
  if(a==="cancel-con"){S._editCon=null;return viewContractors()}
  if(a==="del-con"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to remove";return}await remove("contractors",b.dataset.cid);return}
  if(a==="save-settings"){const s={};["nesoName","nesoPhone","nesoEmail","company","website","formUrl"].forEach(k=>s[k]=$("#s_"+k).value.trim()||DEFAULTS[k]);await S.db.doc("settings/main").set(s);S.settings=Object.assign({},DEFAULTS,s);toast("Settings saved");return}
  }catch(err){console.error(err)}
}
async function onDeskChange(e){
  const t=e.target;
  try{
  if(t.id==="jobStatus"){const j=S.jobs[t.dataset.id];await save("jobs",j.id,Object.assign({},j,{status:t.value,updatedAt:new Date().toISOString()}));toast("Status updated")}
  if(t.dataset.actChange==="q-status"){const q=S.quotes[t.dataset.qid];await save("quotes",q.id,Object.assign({},q,{status:t.value}));}
  if(t.dataset.actChange==="q-owner"){const q=S.quotes[t.dataset.qid];await save("quotes",q.id,Object.assign({},q,{ownerPrice:t.value.trim()}));}
  if(t.id==="markup"||t.id==="showNames"){const j=S.jobs[t.dataset.id];const upd=t.id==="markup"?{markupPct:num(t.value)||0}:{showNames:t.checked};const nj=Object.assign({},j,upd);S.jobs[j.id]=nj;await save("jobs",j.id,nj);}
  if(S.view==="job"&&(t.dataset.actChange||t.id==="markup"||t.id==="showNames")){setTimeout(()=>{if(S.view==="job")viewJob()},50)}
  }catch(err){console.error(err)}
}

/* ---------- boot ---------- */
function boot(){
  const m=(location.hash||"").match(/^#r=([A-Za-z0-9_\-]+)/);
  if(m)return contractorPage(m[1]);
  const hasClaude=()=>typeof window.claude!=="undefined"&&window.claude&&typeof window.claude.use==="function";
  const startDesk=()=>{app.addEventListener("click",onDeskClick);app.addEventListener("change",onDeskChange);$("#nav").addEventListener("click",onDeskClick);desk()};
  if(hasClaude())return startDesk();
  publicLanding();
